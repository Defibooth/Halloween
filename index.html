<!DOCTYPE html>
<html lang="fr">

<title>Défis Photobooth Halloween</title>
<meta name="theme-color" content="#1a1027">

<script>
  // Téléphone en « version ordinateur » : on recale la page sur la largeur réelle de l'écran.
  (function () {
    var w = screen.width;
    if (navigator.maxTouchPoints > 0 && w < 700 && window.innerWidth > w * 1.4) {
      document.documentElement.classList.add('mode-pc');
      document.documentElement.style.setProperty('--k', window.innerWidth / w);
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
  /* Mise en page : une seule colonne sous un ciel de nuit — citrouilles et fantôme posés sur le rouleau, logo éclairé par la lune */
  :root {
    color-scheme: dark;
    --nuit: #1a1027;
    --nuit-2: #2b1740;
    --nuit-3: #120a1c;
    --brume: #c9b8e0;
    --citrouille: #f07c1b;
    --citrouille-vif: #ff9a3c;
    --citrouille-sombre: #b8520a;
    --violet: #6b3fa0;
    --violet-clair: #9b6fd0;
    --lune: #f6edcf;
    --parchemin: #fff4df;
    --encre: #2a1b33;
    --noir: #0d0712;

    --titre: 'Creepster', 'Playfair Display', Georgia, serif;
    --texte: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;

    --fig: clamp(66px, 12dvh, 96px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; background: var(--nuit-3); }

  body {
    font-family: var(--texte);
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at 82% 6%, #4a2f6b 0%, var(--nuit-2) 28%, var(--nuit) 62%, var(--nuit-3) 100%);
    color: var(--brume);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  html.mode-pc body {
    width: calc(100vw / var(--k));
    min-height: calc(100vh / var(--k));
    transform: scale(var(--k));
    transform-origin: 0 0;
  }

  .decor { position: fixed; pointer-events: none; z-index: 0; }

  /* Pleine lune en haut à droite */
  .lune {
    top: max(14px, 4dvh);
    right: 7vw;
    width: clamp(64px, 11dvh, 96px);
    height: auto;
    filter: drop-shadow(0 0 18px rgba(246, 237, 207, 0.45));
  }

  /* Feux follets qui montent doucement */
  .follets span {
    position: fixed;
    bottom: -4vh;
    border-radius: 50%;
    animation: monte linear infinite;
  }
  @keyframes monte {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: 0.9; }
    50%  { transform: translate(var(--derive), -55vh); }
    85%  { opacity: 0.7; }
    100% { transform: translate(0, -108vh); opacity: 0; }
  }

  /* Brume au ras du sol */
  .brume {
    left: -20%;
    right: -20%;
    bottom: -4vh;
    height: 26vh;
    background:
      radial-gradient(ellipse 30% 45% at 20% 70%, rgba(201, 184, 224, 0.22), transparent),
      radial-gradient(ellipse 35% 50% at 60% 80%, rgba(201, 184, 224, 0.18), transparent),
      radial-gradient(ellipse 25% 40% at 90% 65%, rgba(201, 184, 224, 0.2), transparent);
    animation: brume 14s ease-in-out infinite alternate;
  }
  @keyframes brume {
    from { transform: translateX(-4%); }
    to   { transform: translateX(4%); }
  }

  /* Sorcière sur son balai qui passe devant la lune */
  .sorciere {
    position: fixed;
    top: max(6px, 2dvh);
    left: 0;
    width: clamp(90px, 26vw, 130px);
    height: auto;
    z-index: 0;
    pointer-events: none;
    transform: translateX(-110%);
    animation: vol 18s linear 1.5s infinite;
  }
  @keyframes vol {
    0%   { transform: translate(-110%, 40px) rotate(-8deg); }
    25%  { transform: translate(45vw, 10px) rotate(-4deg); }
    50%  { transform: translate(calc(100vw + 10%), -6px) rotate(-8deg); }
    100% { transform: translate(calc(100vw + 10%), -6px) rotate(-8deg); }
  }
  .cape { transform-box: fill-box; transform-origin: 100% 0%; animation: cape 0.6s ease-in-out infinite alternate; }
  @keyframes cape {
    from { transform: skewX(0deg); }
    to   { transform: skewX(12deg); }
  }

  /* Chauves-souris */
  .chauve {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--t, 28px);
    height: auto;
    z-index: 0;
    pointer-events: none;
    animation: virevolte var(--duree, 13s) linear var(--retard, 0s) infinite;
  }
  .chauve .aile { transform-box: fill-box; animation: bat 0.22s ease-in-out infinite alternate; }
  .chauve .aile.g { transform-origin: 100% 50%; }
  .chauve .aile.d { transform-origin: 0% 50%; }
  @keyframes bat {
    from { transform: scaleY(1); }
    to   { transform: scaleY(-0.35); }
  }
  @keyframes virevolte {
    0%   { transform: translate(-40px, var(--y, 20vh)); }
    25%  { transform: translate(25vw, calc(var(--y, 20vh) - 4vh)); }
    50%  { transform: translate(50vw, calc(var(--y, 20vh) + 3vh)); }
    75%  { transform: translate(78vw, calc(var(--y, 20vh) - 5vh)); }
    100% { transform: translate(calc(100vw + 40px), var(--y, 20vh)); }
  }

  /* Toile d'araignée et araignée (coin en haut à gauche) */
  .toile { top: 0; left: 0; width: clamp(90px, 15dvh, 130px); height: auto; opacity: 0.55; }
  .araignee {
    top: 0;
    left: clamp(52px, 9dvh, 76px);
    width: 22px;
    height: auto;
    animation: descend 7s ease-in-out infinite;
  }
  @keyframes descend {
    0%, 100% { transform: translateY(-24px); }
    45%, 60% { transform: translateY(26px); }
  }

  /* Tombes dans les coins du bas */
  .tombe { bottom: 0; width: 92px; height: auto; }
  .tombe.gauche { left: 4px; }
  .tombe.droite { right: 4px; }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6dvh, 14px);
  }

  header { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* Le logo est posé sur un halo de lune pour rester lisible sur le ciel de nuit */
  .logo-cadre {
    position: relative;
    top: -10px;
    display: block;
    width: clamp(170px, 27dvh, 260px);
    max-width: 72vw;
  }
  .logo-cadre::before {
    content: "";
    position: absolute;
    inset: -34% -14%;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(246, 237, 207, 0.95) 0%, rgba(246, 237, 207, 0.8) 45%, rgba(246, 237, 207, 0) 72%);
  }
  .logo { display: block; width: 100%; height: auto; }

  /* Chapeau de sorcière sur le « e » de Defibooth */
  .chapeau {
    position: absolute;
    left: 33.5%;
    bottom: 47%;
    width: 13%;
    height: auto;
    overflow: visible;
    transform-origin: 45% 92%;
    animation: chapeau 3.4s ease-in-out infinite;
    filter: drop-shadow(0 1px 1px rgba(13, 7, 18, 0.35));
  }
  @keyframes chapeau {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(-3deg); }
  }

  .guirlande { display: block; width: clamp(180px, 30dvh, 260px); height: auto; margin-top: -4px; }
  .ampoule { animation: brille 1.6s ease-in-out infinite; }
  @keyframes brille {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  h1 {
    font-family: var(--titre);
    font-size: clamp(2rem, 5.6dvh, 2.7rem);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 1.5px;
    text-wrap: balance;
    color: var(--citrouille);
    text-shadow: 0 0 14px rgba(240, 124, 27, 0.45), 0 2px 0 var(--noir);
  }

  .subtitle {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(0.95rem, 2.4dvh, 1.1rem);
    font-style: italic;
    color: var(--brume);
  }

  .piece {
    position: relative;
    width: 100%;
    margin: calc(var(--fig) * 1.3 + 4px) 0 clamp(6px, 1.6dvh, 16px);
  }

  .citrouilles {
    position: absolute;
    left: 10px;
    bottom: calc(100% - 4px);
    width: calc(var(--fig) * 1.25);
    height: auto;
    overflow: visible;
  }
  .lueur { animation: flamme 1.4s ease-in-out infinite; }
  .lueur.b { animation-duration: 1.9s; animation-delay: 0.4s; }
  @keyframes flamme {
    0%, 100% { opacity: 1; }
    30%      { opacity: 0.7; }
    55%      { opacity: 0.95; }
    75%      { opacity: 0.6; }
  }

  .fantome {
    position: absolute;
    right: 14px;
    bottom: calc(100% + 6px);
    width: calc(var(--fig) * 0.8);
    height: auto;
    overflow: visible;
    animation: flotte 3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(201, 184, 224, 0.45));
  }
  @keyframes flotte {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }

  /* Fenêtre de la machine : on y voit un tambour rayé comme des bas de sorcière qui tourne sur lui-même */
  .card {
    position: relative;
    width: 100%;
    height: clamp(125px, 18dvh, 160px);
    overflow: hidden;
    border: 5px solid var(--nuit-2);
    border-radius: 18px;
    background: var(--nuit-2);
    box-shadow: 0 10px 28px rgba(13, 7, 18, 0.22), inset 0 0 0 2px var(--citrouille);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
  }

  .tambour {
    position: absolute;
    inset: 0;
  }

  /* Chaque face du cylindre : rayures orange et noir, défi sur une étiquette blanche */
  .face {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: var(--h-face, 118px);
    margin-top: calc(var(--h-face, 118px) / -2);
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-linear-gradient(-45deg,
      var(--citrouille) 0 var(--raie, 14px),
      var(--noir) var(--raie, 14px) calc(var(--raie, 14px) * 2));
  }

  .etiquette {
    position: relative;
    width: 88%;
    max-height: 92%;
    padding: 6px 12px;
    border-radius: 12px;
    background: var(--parchemin);
    box-shadow: 0 1px 0 var(--citrouille), 0 2px 8px rgba(13, 7, 18, 0.25);
    font-size: clamp(1rem, 2.3dvh, 1.2rem);
    font-weight: 600;
    line-height: 1.3;
    color: var(--encre);
    text-wrap: balance;
    overflow-wrap: anywhere;
    transition: opacity 0.35s;
  }

  /* Ombre portée sur les faces qui s'éloignent (réglée par le script) */
  .ombre {
    position: absolute;
    inset: 0;
    background: #0d0712;
    opacity: 0;
    pointer-events: none;
  }

  /* Volume du cylindre : haut et bas assombris, reflet brillant du sucre */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(rgba(13, 7, 18, 0.7), rgba(13, 7, 18, 0) 22%, rgba(13, 7, 18, 0) 78%, rgba(13, 7, 18, 0.7));
  }
  .card::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 13%;
    height: 9%;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
  }

  .card.placeholder .etiquette {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: rgba(42, 27, 51, 0.7);
  }

  .card.limit .etiquette { font-family: 'Playfair Display', Georgia, serif; color: var(--citrouille-sombre); }

  .card.stopped {
    transform: scale(1.02);
    box-shadow: 0 0 0 3px var(--citrouille-vif), 0 0 28px rgba(240, 124, 27, 0.6), inset 0 0 0 2px var(--citrouille);
  }

  button {
    width: 100%;
    min-height: 60px;
    margin-top: 4px;
    padding: 16px 0;
    font-family: var(--texte);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--noir);
    background: linear-gradient(135deg, var(--citrouille-sombre) 0%, var(--citrouille-vif) 50%, var(--citrouille) 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    box-shadow: 0 6px 22px rgba(240, 124, 27, 0.35);
    transition: transform 0.2s, box-shadow 0.3s;
  }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--lune); outline-offset: 3px; }
  @media (hover: hover) {
    button:hover { box-shadow: 0 8px 28px rgba(240, 124, 27, 0.5); transform: translateY(-2px); }
  }

  /* Pendant le défilement : violet sorcière */
  button.running {
    color: var(--lune);
    background: linear-gradient(135deg, #4a2878 0%, var(--violet-clair) 50%, var(--violet) 100%);
    box-shadow: 0 6px 22px rgba(155, 111, 208, 0.4);
  }

  button.ralentit { opacity: 0.85; cursor: wait; }

  button:disabled:not(.ralentit) {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  @media (max-width: 420px) {
    .tombe { width: 70px; }
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .follets, .sorciere, .chauve { display: none; }
  }
</style>

      "Fais ta plus belle pose de yoga",
      "Imite un robot",
      "Imite ton animal préféré",
      "Imite un pingouin",
      "Fais semblant de surfer sur une vague",
      "Pose comme si les paparazzis te suivaient partout",
      "Fais semblant d'être une statue de cire",
      "Fais semblant d'être un mannequin qui défile",
      "Montre tes muscles",
      "Imite une star de la chanson",
      "Fais ton plus beau pas de danse",
      "Faites tous le même pas de danse en même temps",
      "Fais semblant de chanter à pleins poumons",
      "Fais semblant de jouer de la guitare",
      "Mime un opéra, avec toute l'émotion possible",
      "Fais semblant de trinquer avec toutes les personnes présentes",
      "Fais semblant d'être surpris(e) en train de manger en cachette",
      "Fais semblant de t'endormir sur l'épaule de ton voisin(e)",
      "Fais semblant de prendre un selfie avec la caméra",
      "Fais un high five à la caméra",
      "Fais discrètement des oreilles de lapin derrière ton voisin(e)",
      "Pose comme si vous étiez les meilleurs amis du monde",
      "Prends la pose d'un duo comique",
      "Faites un câlin groupé",
      "Prends la pose du Titanic",
      "Fais comme si tu venais de rencontrer l'amour de ta vie",
      "Imite la façon dont ton voisin(e) danse",
      "Prends une photo où tout le monde regarde dans une direction différente",
      "Prends une photo où tout le monde fait semblant d'être très en colère",
      "Prends une photo où tout le monde fait semblant d'être endormi"
  ];

  // ---- Feux follets ----
  (function () {
    const zone = document.getElementById('follets');
    const teintes = ['rgba(255, 154, 60, 0.9)', 'rgba(127, 211, 107, 0.85)', 'rgba(155, 111, 208, 0.9)'];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      const taille = 3 + Math.random() * 4;
      const c = teintes[i % teintes.length];
      s.style.left = (Math.random() * 100) + '%';
      s.style.width = s.style.height = taille + 'px';
      s.style.background = c;
      s.style.boxShadow = `0 0 ${taille * 2.5}px ${c}`;
      s.style.animationDuration = (11 + Math.random() * 10).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
      s.style.setProperty('--derive', ((Math.random() * 70) - 35).toFixed(0) + 'px');
      zone.appendChild(s);
    }
  })();

  // ---- Pioche mélangée (aucun défi ne revient avant que tous soient passés) ----
  const CLE = 'defis-halloween-pioche-v1';
  let pioche = [];
  let position = 0;

  function hasard(n) {
    if (window.crypto && crypto.getRandomValues) {
      const max = Math.floor(0x100000000 / n) * n;
      const buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= max);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function melanger(liste) {
    const a = [...liste];
    for (let i = a.length - 1; i > 0; i--) {
      const j = hasard(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sauver() {
    try { localStorage.setItem(CLE, JSON.stringify({ pioche, position })); } catch (e) {}
  }

  function nouvellePioche(dernier) {
    pioche = melanger(tousLesDefis);
    if (dernier && pioche[0] === dernier && pioche.length > 1) {
      const j = 1 + hasard(pioche.length - 1);
      [pioche[0], pioche[j]] = [pioche[j], pioche[0]];
    }
    position = 0;
  }

  function chargerPioche() {
    try {
      const sauvegarde = JSON.parse(localStorage.getItem(CLE));
      const memeListe = sauvegarde
        && Array.isArray(sauvegarde.pioche)
        && sauvegarde.pioche.length === tousLesDefis.length
        && sauvegarde.pioche.every(d => tousLesDefis.includes(d))
        && Number.isInteger(sauvegarde.position);
      if (memeListe) {
        pioche = sauvegarde.pioche;
        position = sauvegarde.position;
        return;
      }
    } catch (e) {}
    nouvellePioche(null);
    sauver();
  }

  function piocherDefi() {
    if (position >= pioche.length) nouvellePioche(pioche[pioche.length - 1]);
    const d = pioche[position++];
    sauver();
    return d;
  }

  chargerPioche();

  // Nombre maximum de défis par session, puis message QR code
  const MAX_DEFIS = 5;
  const MESSAGE_FIN = "Flash le QR code pour continuer";
  let tires = 0;

  const card = document.getElementById('card');
  const tambour = document.getElementById('tambour');
  const annonce = document.getElementById('annonce');
  const btn = document.getElementById('actionBtn');
  const reduit = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Le tambour : un cylindre de NB faces qui tourne autour d'un axe horizontal (projection calculée à la main) ----
  const NB = 10;
  const PAS_ANGLE = 360 / NB;
  const VMAX = 720;          // vitesse de croisière, en degrés par seconde
  const faces = [];
  let rayon = 180;
  let angle = 0;             // rotation actuelle du tambour
  let vitesse = 0;
  let etat = 'repos';        // repos | roule | ralentit
  let dernierT = 0;
  let cible = null;          // { faceIndex, texte } pendant le freinage
  let affiche = null;

  for (let i = 0; i < NB; i++) {
    const f = document.createElement('div');
    f.className = 'face';
    f.innerHTML = '<div class="etiquette"></div><div class="ombre"></div>';
    tambour.appendChild(f);
    faces.push({ el: f, etiquette: f.firstChild, ombre: f.lastChild, rel: 0 });
  }

  function defiAuHasard() {
    let d;
    do { d = tousLesDefis[hasard(tousLesDefis.length)]; } while (d === affiche && tousLesDefis.length > 1);
    affiche = d;
    return d;
  }

  // Taille des faces calée sur la fenêtre ; hauteur multiple du motif pour que les rayures se raccordent
  function dimensionner() {
    const h = card.clientHeight;
    const raie = Math.max(10, Math.round(h / 15));
    const motif = raie * 2 * Math.SQRT2;
    const hFace = Math.max(motif, Math.round((h * 0.7) / motif) * motif);
    rayon = hFace / (2 * Math.tan(Math.PI / NB));
    card.style.setProperty('--raie', raie + 'px');
    card.style.setProperty('--h-face', hFace + 'px');
    dessiner();
  }

  function relatif(i) {
    // Angle de la face par rapport à l'avant (entre -180 et 180). Positif = au-dessus.
    let r = (i * PAS_ANGLE - angle) % 360;
    if (r > 180) r -= 360;
    if (r < -180) r += 360;
    return r;
  }

  function faceDevant() {
    return ((Math.round(angle / PAS_ANGLE) % NB) + NB) % NB;
  }

  function dessiner() {
    const devant = faceDevant();
    faces.forEach((f, i) => {
      const r = relatif(i);
      // Une face passe derrière le tambour : on lui donne un nouveau défi, invisible pour le public
      if (etat !== 'repos' && r > f.rel + 180) {
        f.etiquette.textContent = (cible && cible.faceIndex === i) ? cible.texte : defiAuHasard();
      }
      f.rel = r;
      const rad = r * Math.PI / 180;
      const c = Math.cos(rad);
      // Projection du cylindre : chaque face monte ou descend et s'écrase en s'éloignant de l'avant
      f.el.style.transform = `translateY(${(-rayon * Math.sin(rad)).toFixed(2)}px) scaleY(${Math.max(0, c).toFixed(4)})`;
      f.ombre.style.opacity = Math.max(0, Math.min(0.85, (1 - c) * 1.1)).toFixed(3);
      // Les faces de l'arrière du cylindre sont masquées
      f.el.style.visibility = c > 0.01 ? 'visible' : 'hidden';
      // À l'arrêt, seul le défi de face reste lisible : les voisins ne montrent que les rayures
      f.etiquette.style.opacity = (etat === 'repos' && i !== devant) ? '0' : '1';
    });
  }

  function texteDevant(texte) {
    faces[faceDevant()].etiquette.textContent = texte;
  }

  // Remplissage de départ
  faces.forEach(f => { f.etiquette.textContent = defiAuHasard(); });
  dimensionner();
  texteDevant("Touche le bouton pour lancer");
  window.addEventListener('resize', dimensionner);

  // Rotation libre (accélère jusqu'à la vitesse de croisière)
  function tourner(t) {
    if (etat !== 'roule') return;
    const dt = Math.min(0.05, (t - dernierT) / 1000);
    dernierT = t;
    vitesse = Math.min(VMAX, vitesse + VMAX * dt / 0.4);
    angle += vitesse * dt;
    dessiner();
    requestAnimationFrame(tourner);
  }

  // Freinage jusqu'à une face précise, puis petit rebond
  function freiner(texteFinal) {
    const v = Math.max(vitesse, 200);
    const distanceMin = Math.max(400, v * 0.9);
    const arrivee = Math.ceil((angle + distanceMin) / PAS_ANGLE) * PAS_ANGLE;
    const depart = angle;
    const distance = arrivee - depart;
    const duree = reduit ? 0 : (3 * distance / v) * 1000;
    cible = { faceIndex: ((Math.round(arrivee / PAS_ANGLE) % NB) + NB) % NB, texte: texteFinal };
    const t0 = performance.now();
    let derniereCase = Math.floor(angle / PAS_ANGLE);

    return new Promise(fini => {
      function etape(t) {
        const u = duree ? Math.min(1, (t - t0) / duree) : 1;
        angle = depart + distance * (1 - Math.pow(1 - u, 3));
        // Petit « clic » à chaque face quand ça ralentit
        const caseActuelle = Math.floor(angle / PAS_ANGLE);
        if (caseActuelle !== derniereCase) {
          derniereCase = caseActuelle;
          if (u > 0.45 && navigator.vibrate) navigator.vibrate(5);
        }
        dessiner();
        if (u < 1) { requestAnimationFrame(etape); return; }
        faces[cible.faceIndex].etiquette.textContent = texteFinal;
        // Rebond : le tambour dépasse un peu puis revient
        const r0 = performance.now();
        function rebond(t2) {
          const w = reduit ? 1 : Math.min(1, (t2 - r0) / 380);
          angle = arrivee + 7 * Math.sin(w * Math.PI) * (1 - w);
          dessiner();
          if (w < 1) requestAnimationFrame(rebond);
          else { angle = arrivee; dessiner(); fini(); }
        }
        requestAnimationFrame(rebond);
      }
      requestAnimationFrame(etape);
    });
  }

  // Confettis dessinés sur notre propre calque, sans « worker » (évite l'avertissement de l'aperçu Claude)
  let tir = null;
  if (typeof confetti === 'function' && confetti.create) {
    const calque = document.createElement('canvas');
    calque.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100';
    document.body.appendChild(calque);
    tir = confetti.create(calque, { resize: true, useWorker: false });
  }

  const confettiColors = ['#f07c1b', '#ff9a3c', '#6b3fa0', '#9b6fd0', '#7fd36b', '#f6edcf', '#0d0712'];
  let formesFete = null;
  try {
    if (typeof confetti === 'function' && confetti.shapeFromText) {
      formesFete = ['🎃', '🦇', '👻'].map(t => confetti.shapeFromText({ text: t, scalar: 2 }));
    }
  } catch (e) { formesFete = null; }

  function launchConfetti() {
    if (!tir) return;
    tir({ particleCount: 180, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors: confettiColors });
    tir({ particleCount: 80, spread: 160, startVelocity: 30, scalar: 1.2, origin: { y: 0.6 }, colors: confettiColors });
    if (formesFete) {
      tir({ particleCount: 36, spread: 130, startVelocity: 38, scalar: 2, shapes: formesFete, flat: true, origin: { y: 0.6 } });
    }
    const end = Date.now() + 2000;
    (function frame() {
      tir({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors: confettiColors });
      tir({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors: confettiColors });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  async function toggleLoop() {
    if (etat === 'ralentit') return;

    if (etat === 'roule') {
      etat = 'ralentit';
      btn.textContent = "…";
      btn.disabled = true;
      btn.classList.add('ralentit');
      // Le vrai défi est pioché dans la pioche mélangée
      const defi = piocherDefi();
      await freiner(defi);
      tires++;
      etat = 'repos';
      cible = null;
      dessiner();
      annonce.textContent = defi;
      card.classList.add('stopped');
      btn.disabled = false;
      btn.classList.remove('ralentit', 'running');
      btn.textContent = "Recommencer";
      if (navigator.vibrate) navigator.vibrate(60);
      launchConfetti();
      return;
    }

    // Limite atteinte : le message remplace le défi et le bouton se bloque
    if (tires >= MAX_DEFIS) {
      card.classList.remove('stopped', 'placeholder');
      card.classList.add('limit');
      texteDevant(MESSAGE_FIN);
      annonce.textContent = MESSAGE_FIN;
      btn.disabled = true;
      return;
    }

    etat = 'roule';
    btn.textContent = "Stop !";
    btn.classList.add('running');
    card.classList.remove('stopped', 'placeholder');
    vitesse = 0;
    dernierT = performance.now();
    requestAnimationFrame(tourner);
  }

  btn.addEventListener('click', toggleLoop);
</script>

</html>
